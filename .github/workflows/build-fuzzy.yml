on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

env:
  VERIFICARLO_VERSION: v2.6.0

jobs:
  fuzzy:
    runs-on: ubuntu-24.04
    env:
      RUN_IF_CHANGED: Dockerfile
    strategy:
      max-parallel: 1
      matrix:
        include:
          - NAME: Lapack + Libmath
            FROM: ""
            TO: lapack
            DOCKER_FILE: ./docker/python/Dockerfile.0-lapack-libmath

          - NAME: Python
            FROM: "lapack"
            TO: lapack-python3.12.13
            DOCKER_FILE: ./docker/python/Dockerfile.1-python

          - NAME: Numpy
            FROM: "lapack-python3.12.13"
            TO: lapack-python3.12.13-numpy
            DOCKER_FILE: ./docker/python/Dockerfile.2-numpy

          - NAME: Scipy
            FROM: "lapack-python3.12.13-numpy"
            TO: lapack-python3.12.13-numpy-scipy
            DOCKER_FILE: ./docker/python/Dockerfile.3-scipy

          - NAME: Scikit-Learn
            FROM: "lapack-python3.12.13-numpy-scipy"
            TO: lapack-python3.12.13-numpy-scipy-sklearn
            DOCKER_FILE: ./docker/python/Dockerfile.4-sklearn

    name: ${{ matrix.NAME }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for file changes
        uses: tj-actions/changed-files@v46
        id: changes

      - name: Print list of changed files
        run: echo ${{ steps.changes.outputs.files }}

      - name: If Dockerfiles have been updated, cancel running upstream jobs
        if: contains(steps.changes.outputs.all_changed_files, '${{ env.RUN_IF_CHANGED }}')
        continue-on-error: true
        uses: n1hility/cancel-previous-runs@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine if images will be pushed to Docker, and login as needed
        if: contains(steps.changes.outputs.all_changed_files, '${{ env.RUN_IF_CHANGED }}')
        run: |
          if ([ "${{github.event_name}}" == "push" ] && [ "${{github.ref}}" == "refs/heads/master" ])
          then
              echo This is a push to master: we will push to Docker Hub
              echo "PUSH=true" >> "$GITHUB_ENV"
              export PUSH=true
              docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} -p ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          else
              echo This is a PR or non-master push: we will not push to Docker Hub
              echo "PUSH=false" >> "$GITHUB_ENV"
          fi

      - name: Download Docker artifacts, if available
        if: contains(steps.changes.outputs.all_changed_files, '${{ env.RUN_IF_CHANGED }}') && matrix.FROM != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: fuzzy_${{ env.VERIFICARLO_VERSION }}-${{ matrix.FROM }}
          path: /tmp

      - name: Build and Push Docker image
        if: contains(steps.changes.outputs.all_changed_files, '${{ env.RUN_IF_CHANGED }}')
        run: |
          from=fuzzy_${VERIFICARLO_VERSION}-${{ matrix.FROM }}
          image=verificarlo/fuzzy:${VERIFICARLO_VERSION}-${{ matrix.TO }}
          if [ -n "${{ matrix.FROM }}" ] && [ -f "/tmp/${from}.tar" ]
          then
            docker load --input /tmp/${from}.tar
            docker image ls -a
          fi

          docker build ./ -t ${image} \
                          -f ${{ matrix.DOCKER_FILE }} \
                          --build-arg VERIFICARLO_VERSION=${VERIFICARLO_VERSION}

          docker save ${image} -o /tmp/fuzzy_${VERIFICARLO_VERSION}-${{ matrix.TO }}.tar
          if [ "$PUSH" = "true" ]
          then
            docker push ${image}
          fi

      - name: Upload Docker artifacts
        if: contains(steps.changes.outputs.all_changed_files, '${{ env.RUN_IF_CHANGED }}')
        uses: actions/upload-artifact@v4
        with:
          name: fuzzy_${{ env.VERIFICARLO_VERSION }}-${{ matrix.TO }}
          path: /tmp/fuzzy_${{ env.VERIFICARLO_VERSION }}-${{ matrix.TO }}.tar

  # Prototype of one image per x86-64 level (#53): build and test the
  # x86-64-v3 image. Nothing is pushed yet.
  fuzzy-level:
    name: Level image x86-64-v3 (build and test)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for file changes
        uses: tj-actions/changed-files@v46
        id: changes
        with:
          files: |
            docker/fuzzy/**
            docker/pytorch/Dockerfile.verificarlo
            docker/resources/**

      - name: Free disk space
        if: steps.changes.outputs.any_changed == 'true'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build and test
        if: steps.changes.outputs.any_changed == 'true'
        run: docker/fuzzy/build.sh v3 docker

  rename-publish:
    needs: fuzzy
    runs-on: ubuntu-24.04
    env:
      RUN_IF_CHANGED: docker
      DOCKER_IMAGE: verificarlo/fuzzy
      FINAL_STAGE: lapack-python3.12.13-numpy-scipy-sklearn

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for file changes
        uses: tj-actions/changed-files@v46
        id: changes

      - name: Print list of changed files
        run: echo ${{ steps.changes.outputs.all_changed_files }}

      - name: If Dockerfiles have been updated, cancel running upstream jobs
        if: contains(steps.changes.outputs.all_changed_files, '${{ env.RUN_IF_CHANGED }}')
        uses: n1hility/cancel-previous-runs@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine if images will be pushed to Docker, and login as needed
        if: contains(steps.changes.outputs.all_changed_files, '${{ env.RUN_IF_CHANGED }}')
        run: |
          if ([ "${{github.event_name}}" == "push" ] && [ "${{github.ref}}" == "refs/heads/master" ])
          then
              echo This is a push to master: we will push to Docker Hub
              echo "PUSH=true" >> "$GITHUB_ENV"
              docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} -p ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          else
              echo This is a PR or non-master push: we will not push to Docker Hub
              echo "PUSH=false" >> "$GITHUB_ENV"
          fi

      - name: Download Docker artifacts, if available
        if: contains(steps.changes.outputs.all_changed_files, '${{ env.RUN_IF_CHANGED }}')
        uses: actions/download-artifact@v4
        with:
          name: fuzzy_${{ env.VERIFICARLO_VERSION }}-${{ env.FINAL_STAGE }}
          path: /tmp

      - name: Load, Rename, and Push Docker image
        if: contains(steps.changes.outputs.all_changed_files, '${{ env.RUN_IF_CHANGED }}')
        run: |
          docker load --input /tmp/fuzzy_${VERIFICARLO_VERSION}-${FINAL_STAGE}.tar
          docker image ls -a

          docker image tag ${{ env.DOCKER_IMAGE }}:${VERIFICARLO_VERSION}-${FINAL_STAGE} \
                          ${{ env.DOCKER_IMAGE }}:latest

          if [ "$PUSH" = "true" ]
          then
            docker push ${{ env.DOCKER_IMAGE }}:latest
          fi
