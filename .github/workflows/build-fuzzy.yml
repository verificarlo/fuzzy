name: Level images
on:
  push:
    branches: ['**']
    paths: ['docker/fuzzy/**', 'docker/resources/**', '.github/workflows/build-fuzzy.yml']
  pull_request:
    paths: ['docker/fuzzy/**', 'docker/resources/**', '.github/workflows/build-fuzzy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzzy-level-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FUZZY_VERIFICARLO_VERSION: v2.7.0
  FUZZY_PRISM_VERSION: 0.0.12

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - id: matrix
        env:
          TRUSTED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          rows = [dict(level=f'v{i}', isa=isa, runner=['ubuntu-24.04'])
                  for i, isa in enumerate(['sse2', 'sse4', 'avx2'], 1)]
          # Fork PRs run on hosted runners. The fork's push workflow may also
          # validate v4 on its own trusted self-hosted runner.
          if os.environ['TRUSTED'] == 'true':
              rows.append(dict(level='v4', isa='avx512',
                               runner=['self-hosted', 'Linux', 'X64', 'avx512']))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('include=' + json.dumps(rows) + '\n')
          PYTHON

  build:
    needs: matrix
    name: Level image ${{ matrix.level }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Free hosted runner disk space
        if: matrix.level != 'v4'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build and test both flavors
        run: docker/fuzzy/build.sh '${{ matrix.level }}' docker
      - name: Install Intel SDE
        if: matrix.level != 'v4'
        run: docker/fuzzy/tests/install-sde.sh "$RUNNER_TEMP/intel-sde"
      - name: Test on the target CPU under Intel SDE
        if: matrix.level != 'v4'
        run: docker/fuzzy/tests/run-sde.sh '${{ matrix.level }}' "verificarlo/fuzzy:${FUZZY_VERIFICARLO_VERSION}-x86-64-${{ matrix.level }}" "$RUNNER_TEMP/intel-sde" docker
      - name: Authenticate to Docker Hub
        if: github.repository == 'verificarlo/fuzzy' && github.ref == 'refs/heads/master' && github.event_name == 'push'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
        run: printf '%s' "$DOCKER_TOKEN" | docker login --username "$DOCKER_USERNAME" --password-stdin
      - name: Publish validated level and ISA tags
        if: github.repository == 'verificarlo/fuzzy' && github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          docker push "verificarlo/fuzzy:${FUZZY_VERIFICARLO_VERSION}-x86-64-${{ matrix.level }}"
          docker push "verificarlo/fuzzy:${FUZZY_VERIFICARLO_VERSION}-${{ matrix.isa }}"

  required-checks:
    # Preserve the existing protected-branch check names. Each now requires
    # the complete level-image build, including every package's image tests.
    needs: build
    if: always()
    name: ${{ matrix.name }}
    strategy:
      matrix:
        name: ['Lapack + Libmath', 'Python', 'Numpy', 'Scipy', 'Scikit-Learn']
    runs-on: ubuntu-24.04
    steps:
      - name: Require all level-image checks to pass
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = success

  latest:
    needs: build
    if: github.repository == 'verificarlo/fuzzy' && github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Authenticate to Docker Hub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
        run: printf '%s' "$DOCKER_TOKEN" | docker login --username "$DOCKER_USERNAME" --password-stdin
      - name: Point latest at the portable v1 image
        run: |
          image="verificarlo/fuzzy:${FUZZY_VERIFICARLO_VERSION}-x86-64-v1"
          docker pull "$image"
          docker tag "$image" verificarlo/fuzzy:latest
          docker push verificarlo/fuzzy:latest
