name: Mirror to GHCR
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Verificarlo version whose Docker Hub tags are copied (defaults to the level image version)
        required: false

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    if: github.repository == 'verificarlo/fuzzy'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | skopeo login --username '${{ github.actor }}' --password-stdin ghcr.io
      - name: Copy the published Docker Hub manifests
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # The images are already validated and published on Docker Hub by
          # the level image workflow. Copy their manifests instead of
          # rebuilding so both registries serve identical digests.
          version=${VERSION:-$(sed -n 's/^  FUZZY_VERIFICARLO_VERSION: //p' .github/workflows/build-fuzzy.yml)}
          test -n "$version"
          tags=(latest)
          for suffix in x86-64-v1 x86-64-v2 x86-64-v3 x86-64-v4 sse2 sse4 avx2 avx512; do
            tags+=("$version-$suffix")
          done
          for tag in "${tags[@]}"; do
            skopeo copy --all --preserve-digests --retry-times 3 \
              "docker://docker.io/verificarlo/fuzzy:$tag" "docker://ghcr.io/verificarlo/fuzzy:$tag"
            src=$(skopeo inspect --format '{{.Digest}}' "docker://docker.io/verificarlo/fuzzy:$tag")
            dst=$(skopeo inspect --format '{{.Digest}}' "docker://ghcr.io/verificarlo/fuzzy:$tag")
            test "$src" = "$dst"
            echo "$tag $dst"
          done
